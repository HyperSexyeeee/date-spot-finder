<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Date Spot Finder</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1 id="message">こんにちは！</h1>

  <button id="changeButton">メッセージを変える</button>

  <script src="script.js"></script>

</html>
